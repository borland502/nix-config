[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "technitium-dash"
version = "0.2.0"
description = "Technitium DNS stats and live query panel"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "rich>=13.7",
]

# Dev-only tooling. Not runtime dependencies, so the Nix closure is unaffected —
# `buildPythonApplication` reads [project.dependencies], not this group.
[dependency-groups]
dev = [
  "mypy>=1.11",
  "ruff>=0.6",
]

[project.scripts]
technitium-dash = "technitium_dash.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/technitium_dash"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "CPY",    # no copyright notices required
  "T201",   # allow print()
  "D203",   # incompatible with D211
  "D213",   # incompatible with D212
  "COM812", # conflicts with the formatter
  "ANN401", # object is the honest type for API payloads
]

[tool.mypy]
python_version = "3.11"
strict = true
