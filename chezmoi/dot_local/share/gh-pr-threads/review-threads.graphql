query ReviewThreads($owner: String!, $repo: String!, $number: Int!, $cursor: String, $commentsCount: Int!) {
  repository(owner: $owner, name: $repo) {
    pullRequest(number: $number) {
      reviewThreads(first: 100, after: $cursor) {
        pageInfo { hasNextPage endCursor }
        nodes {
          id
          isResolved
          isOutdated
          path
          line
          comments(first: $commentsCount) {
            pageInfo { hasNextPage endCursor }
            nodes {
              id
              databaseId
              createdAt
              author { login }
              body
              url
            }
          }
        }
      }
    }
  }
}
