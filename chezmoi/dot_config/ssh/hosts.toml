# --- Technitium DNS (dns.local.technohouser.com / 192.168.2.19, the
# technitiumdns LXC above). Reconciled 2026-08-25: local.technohouser.com now
# holds 25 A records + 3 CNAMEs and is the naming authority, so the `hostname`
# keys above are FQDNs rather than IPs.
#
# Deliberately still on raw IPs — these are the hosts you must reach to fix DNS
# itself, so they must not depend on it:
#   technitiumdns (.19) and the four PVE nodes lyse/salmissra/mara/minfilia.
#
# CNAMEs exist where the DNS name predates the PVE guest name:
#   technitiumdns -> dns, npmplus -> npm, postgresql -> postgres
#
# Guests that are STOPPED have no A record and stay on IP here: caddy-116,
# dashy-132, worksites-dashy, fenrus. caddy-101 is running but excluded by
# request. aerith is powered off and holds .85 by DHCP — worth a static IP,
# since that lease was handed to caitsith while aerith was down.
#
# Not a PVE guest and not in this file: *.casaos.technohouser.com -> 192.168.2.18.
# Forward zones served: local / npm / zoraxy / casaos .technohouser.com.
