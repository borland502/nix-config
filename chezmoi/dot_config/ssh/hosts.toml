# SSH host aliases, ported from the hand-written ~/.ssh/config that predated
# this repo (files dated 2021). Only the host aliases live here — key material
# stays on disk and out of git.
#
# Consumed two ways:
#   * home-manager/common.nix reads this file at eval time (from the repo copy,
#     not the deployed one — flake eval is pure) and renders each table into
#     programs.ssh.settings, i.e. a Host block in ~/.ssh/config.
#   * chezmoi deploys it to ~/.config/ssh/hosts.toml as the readable source of
#     truth for non-Nix hosts and for scripts that want the inventory.
#
# Table name = the Host pattern. Keys are home-manager programs.ssh.settings
# options (hostname, user, port, compression, ...), so anything that module
# accepts can be added here without touching Nix.
#
# Two keys here are NOT ssh options. Both exist for the same reason: something
# needs an answer about a host at a moment when the host itself cannot be asked.
#
#   `desktop`  the remoting protocol served, "rdp" or "vnc". remote-desktop
#              DETECTS this live and ignores the key — a running host is the
#              better authority. The Remmina GUI profiles cannot: they are
#              static files written by run_onchange_generate-remmina-profiles.sh
#              at chezmoi-apply time and read long before any connection is
#              attempted. Omit it on a host with no desktop (hassio) and no
#              profile is generated.
#
#   `mac`      the wired NIC's hardware address, for Wake-on-LAN. A magic packet
#              is the one thing that must be addressed to a host that is *off*,
#              so ARP cannot resolve it and nothing can be discovered at send
#              time. If it was not written down while the host was up, it cannot
#              be found once the host is down — which is precisely the state you
#              want to wake it out of. Omit it and `wake` says so instead of
#              failing obscurely.
#
# home-manager/common.nix strips both before the table reaches
# programs.ssh.settings: an unrecognised keyword in ~/.ssh/config makes *every*
# ssh invocation fail, not just one to the offending host.

# Own hosts, reached with the dedicated remoting key (secrets/remoting-ssh.yaml,
# materialized to ~/.ssh/id_remoting by home-manager/modules/sops.nix). These
# hosts authorize that key only and refuse passwords, so identitiesonly keeps
# ssh from burning MaxAuthTries=3 offering other keys first.
#
# Service ports on these are closed by design — reach them by forwarding, e.g.
#   ssh -N -L 3389:localhost:3389 tifa      # KRdp
[hosts.tifa]
  desktop = "rdp"
  hostname = "192.168.2.145"
  mac = "cc:96:e5:8a:1a:b7"          # enp0s31f6, e1000e
  identitiesonly = "yes"
  identityfile = "~/.ssh/id_remoting"
  user = "jhettenh"

# The kiosk panel: cage + wayvnc, provisioned by
# run_onchange_provision-cloud-kiosk.sh. KRdp cannot serve that session (it
# needs the KDE portal), so this one is VNC and, unlike the KRdp hosts, has no
# credential of its own — the ssh tunnel is the whole of its access control.
[hosts.cloud]
  desktop = "vnc"
  hostname = "192.168.2.113"
  mac = "84:7b:eb:4b:db:78"          # enp0s31f6, e1000e
  identitiesonly = "yes"
  identityfile = "~/.ssh/id_remoting"
  user = "jhettenh"

# No `mac`, and there never will be one: this host has no wired NIC at all —
# only wlp0s20f3 (iwlwifi). Wake-on-LAN cannot reach it. Its wireless address
# (f4:a4:75:43:ce:02) is NOT a substitute and must not be put here: a
# powered-off card is not associated to anything, so nothing would receive the
# packet, and the failure would look like a BIOS problem instead of a physical
# one. Give it a USB/dock ethernet adapter that stays powered at S5 if this host
# ever needs to be woken remotely.
[hosts.aerith]
  desktop = "rdp"
  hostname = "192.168.2.85"
  identitiesonly = "yes"
  identityfile = "~/.ssh/id_remoting"
  user = "jhettenh"

[hosts.hassio]
  hostname = "192.168.2.111"
  user = "root"

[hosts.hassio-root]
  hostname = "192.168.2.111"
  port = 2222
  user = "hassio"
