# --- Technitium DNS cross-reference (dns.local.technohouser.com / 192.168.2.19,
# the technitiumdns LXC above), ingested 2026-08-22. Every IP that DNS and this
# file share AGREES — no IP conflicts. Recorded here because DNS is the naming
# authority and its canonical names differ from the PVE guest names used as
# table names above:
#   technitiumdns (.19)  is  dns.local.technohouser.com
#   npmplus       (.159) is  npm.local.technohouser.com   (+ *.npm wildcard)
#   postgresql    (.8)   is  postgres.local.technohouser.com
#   zoraxy        (.137) is  *.zoraxy.technohouser.com     (reverse-proxy wildcard)
#   lyse/.9, pbs/.5, autoplex/.115  match by name too.
# DNS knows one host this file does NOT: *.casaos.technohouser.com -> 192.168.2.18,
# which is not a PVE guest (a separate CasaOS box). DNS coverage is otherwise
# sparse: only ~9 hosts have A records, so most guests above resolve by IP only.
# The forward zones served are: local / npm / zoraxy / casaos .technohouser.com.
