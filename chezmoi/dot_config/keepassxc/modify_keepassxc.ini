#!/usr/bin/env bash
# modify_keepassxc.ini — assert the KeePassXC UI theme without owning the file.
#
# Why a modify_ script instead of home-manager's xdg.configFile:
#   * keepassxc.ini holds a [KeeShare] RSA private key and is written by the
#     app on every exit (geometry, recent databases, last-used settings). A
#     home-manager-deployed copy would be read-only and would drag that key
#     into git.
#   * A modify_ script receives the current file on stdin and emits the new
#     contents on stdout, so we rewrite exactly one key and pass the rest
#     through byte-for-byte. The private key never enters the source tree.
#
# Why we set it at all: KeePassXC's default theme is "auto", resolved once at
# startup from the XDG portal / Qt palette and never re-checked. On a KDE
# autostart it can lose the race with the theme apply (observed: kdeglobals
# written 19:59:35.900, keepassxc started 19:59:36) and stay light for the
# whole session. Pinning the theme removes the race.
#
# Deployment is gated in .chezmoiignore.tmpl to hosts that already have the
# ini — this never creates a KeePassXC config on a host without KeePassXC.

set -euo pipefail

THEME="dark"

awk -v theme="$THEME" '
  # An empty target means KeePassXC is not configured here; emit nothing
  # rather than conjuring a config file. (Belt-and-braces: .chezmoiignore.tmpl
  # already gates this script on the ini existing.)
  BEGIN { in_gui = 0; seen_gui = 0 }

  /^\[/ {
    if ($0 == "[GUI]") {
      seen_gui = 1
      in_gui = 1
      print
      print "ApplicationTheme=" theme
      next
    }
    in_gui = 0
    print
    next
  }

  # Drop any pre-existing ApplicationTheme inside [GUI]; ours was already
  # emitted directly under the section header.
  in_gui && /^[[:space:]]*ApplicationTheme[[:space:]]*=/ { next }

  { print }

  END {
    if (NR > 0 && !seen_gui) {
      print ""
      print "[GUI]"
      print "ApplicationTheme=" theme
    }
  }
'
