# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  IS_WINDOWS: '{{eq OS "windows"}}'
  IS_LINUX: '{{eq OS "linux"}}'
  IS_DARWIN: '{{eq OS "darwin"}}'

  # Resolve chezmoi from PATH or fall back to a temporary nix shell. This
  # covers the bootstrap window where home-manager has not yet activated the
  # nix profile (and therefore chezmoi is not yet on PATH).
  CHEZMOI:
    sh: command -v chezmoi 2>/dev/null || printf 'nix shell nixpkgs#chezmoi --command chezmoi'

  # Auto-detect host based on hostname or allow override.
  # The generic names in this repo are placeholder install targets for new systems.
  DETECTED_HOST:
    sh: |
      {{if eq OS "windows"}}echo linux{{else}}
      os=$(uname)
      hostname=$(hostname)
      case "$os:$hostname" in
        "Darwin:"*) echo "darwin" ;;
        "Linux:nixos"|"Linux:wsl") echo "wsl" ;;
        "Linux:linux") echo "linux" ;;
        "Linux:"*)
          if grep -qi microsoft /proc/version 2>/dev/null && [ -f /etc/os-release ]; then
            distro_id=$(. /etc/os-release 2>/dev/null && echo "$ID")
            case "$distro_id" in
              debian) echo "debian-wsl" ;;
              ubuntu) echo "ubuntu-wsl" ;;
              *) echo "linux" ;;
            esac
          else
            echo "linux"
          fi
        ;;
        *) echo "linux" ;;
      esac
      {{end}}
  HOST: '{{.HOST | default .DETECTED_HOST}}'
  HOME_ATTR:
    sh: |
      {{if eq OS "windows"}}echo windows{{else}}
      case "{{.HOST | default .DETECTED_HOST}}" in
        "wsl") echo "jhettenh@wsl" ;;
        *) echo "jhettenh@{{.HOST | default .DETECTED_HOST}}" ;;
      esac
      {{end}}
  SYSTEM_FLAKE:
    sh: |
      {{if eq OS "windows"}}echo .{{else}}
      case "{{.HOST | default .DETECTED_HOST}}" in
        "wsl") printf 'path:%s#wsl\n' "$PWD" ;;
        *) printf '.#%s\n' "{{.HOST | default .DETECTED_HOST}}" ;;
      esac
      {{end}}
  HOME_FLAKE:
    sh: |
      {{if eq OS "windows"}}echo .{{else}}
      case "{{.HOST | default .DETECTED_HOST}}" in
        "wsl") printf 'path:%s#jhettenh@wsl\n' "$PWD" ;;
        *) printf '.#%s\n' "{{.HOME_ATTR}}" ;;
      esac
      {{end}}
  HOME_MANAGER_APP:
    sh: |
      {{if eq OS "windows"}}echo .{{else}}
      case "{{.HOST | default .DETECTED_HOST}}" in
        "wsl") printf 'path:%s#home-manager\n' "$PWD" ;;
        *) printf '.#home-manager\n' ;;
      esac
      {{end}}
  NIX_CONFIG_PREFIX:
    sh: |
      {{if eq OS "windows"}}echo{{else}}
      case "{{.HOST | default .DETECTED_HOST}}" in
        "wsl") printf 'NIX_CONFIG="experimental-features = nix-command flakes" ' ;;
        *) printf '' ;;
      esac
      {{end}}
  ROOT_CMD:
    sh: |
      {{if eq OS "windows"}}echo sudo{{else}}
      if [[ "$(uname)" == "Linux" && -x /run/wrappers/bin/sudo ]]; then
        printf '/run/wrappers/bin/sudo\n'
      else
        printf 'sudo\n'
      fi
      {{end}}
  IN_DEVCONTAINER:
    sh: |
      {{if eq OS "windows"}}echo false{{else}}
      [[ -n "${INSIDE_DEVCONTAINER:-}" ]] && echo "true" || echo "false"
      {{end}}
  IS_NIXOS:
    sh: |
      {{if eq OS "windows"}}echo false{{else}}
      command -v nixos-rebuild > /dev/null 2>&1 && echo "true" || echo "false"
      {{end}}
  DEVCONTAINER_ATTR:
    sh: |
      {{if eq OS "windows"}}echo "vscode@devcontainer"{{else}}
      arch=$(uname -m)
      if [[ "$arch" == "aarch64" || "$arch" == "arm64" ]]; then
        echo "vscode@devcontainer-aarch64"
      else
        echo "vscode@devcontainer"
      fi
      {{end}}

tasks:
  # Internal helper — records $PWD so home-manager activation can wire chezmoi
  # to the correct repo location regardless of what the directory is named.
  _record-nix-config-dir:
    internal: true
    platforms: [linux, darwin]
    # Ordered after the snapshot so the snapshot's interactive sudo prompt gets
    # the terminal to itself. go-task runs a task's deps concurrently, so without
    # this the snapshot competed with _chezmoi-ensure's heartbeat and the sudo
    # password prompt was buried. Every switch task pairs these helpers with
    # _snapshot-pre, so this only reorders — it never adds a snapshot anywhere.
    deps: [_snapshot-pre]
    cmd: |
      mkdir -p "$HOME/.local/state/chezmoi"
      printf '%s\n' "$PWD" > "$HOME/.local/state/chezmoi/nix-config-dir"

  _snapshot-pre:
    internal: true
    platforms: [linux, darwin]
    # run: once — go-task's default `run` is `always`, so a task runs once per
    # reference. This is now depended on directly by the switch tasks AND
    # transitively via _record-nix-config-dir / _chezmoi-ensure, so without this
    # it would fire (and prompt for sudo / create a snapshot) up to three times
    # per switch. `once` collapses that to a single execution per invocation.
    run: once
    # Best-effort btrfs safety snapshot taken BEFORE any activation (switch /
    # home-switch / upgrade). snap-pac already brackets pacman transactions, but
    # nothing captured nix/home-manager switches — this fills that gap so a bad
    # switch can be rolled back (grub-btrfs boot-into-snapshot). The `root`
    # config's subvolume is `/`, which includes `/nix`, so the pre-switch store
    # closure is preserved (this is exactly what a dangling-profile recovery
    # needs). It does NOT capture `/home` (@home has no snapper config); user
    # dotfiles are already covered by home-manager generations + `-b backup`.
    #
    # No-op unless a snapper `root` config exists, so it silently skips on macOS,
    # WSL, and non-snapper Linux. It also skips when running non-interactively
    # without usable root (CI, agent shells) so a sudo password prompt can't
    # abort an otherwise-headless switch. When snapper IS present and root is
    # reachable it is fail-closed: a genuine snapshot failure aborts the switch
    # rather than proceeding unprotected — bypass with SKIP_SNAPSHOT=1. Snapshots
    # use the `number` cleanup algorithm so snapper's NUMBER_CLEANUP rotates them
    # out like snap-pac's.
    cmd: |
      _helper="$HOME/.local/bin/btrfs-safety-snapshot"
      if [ ! -x "$_helper" ]; then
        printf 'snapshot: btrfs-safety-snapshot not deployed yet (run `task home-switch` once to deploy); skipping.\n'
        exit 0
      fi
      "$_helper" "pre nix switch $(date +%FT%T)" nix-switch

  # chezmoi — dotfile management backed by this repo
  chezmoi-init:
    desc: Point chezmoi at this repo and regenerate config from template (run once after cloning to a new path)
    cmds:
      - cmd: |
          mkdir -p "$HOME/.local/state/chezmoi"
          printf '%s\n' "$PWD" > "$HOME/.local/state/chezmoi/nix-config-dir"
        platforms: [linux, darwin]
      - |
        _src=$(printf '%s/chezmoi' "$PWD" | tr '\\' '/')
        {{.CHEZMOI}} init --source "$_src"

  chezmoi-apply:
    desc: Apply chezmoi dotfiles to the home directory
    cmd: '{{.CHEZMOI}} apply'

  _chezmoi-ensure:
    internal: true
    desc: Initialize chezmoi if needed, then apply
    # Ordered after the snapshot (see _record-nix-config-dir): this task's
    # heartbeat output otherwise collides with the snapshot's sudo prompt, since
    # go-task runs sibling deps concurrently.
    deps: [_snapshot-pre]
    # chezmoi's git-repo externals pull from github.com, which is configured here
    # to use the `gh auth git-credential` helper. Without these guards a transient
    # 401/rate-limit (or a stalled helper) drops git into an interactive
    # credential prompt that hangs the whole switch. Force non-interactive,
    # fail-fast git so a problem external errors out instead of blocking.
    env:
      GIT_TERMINAL_PROMPT: "0"
      GIT_ASKPASS: "true"
      SSH_ASKPASS: "true"
      GCM_INTERACTIVE: "never"
      GIT_SSH_COMMAND: "ssh -oBatchMode=yes -oConnectTimeout=10"
      # The SSH/prompt guards above only cover SSH and credential prompts; the
      # git-repo externals pull over HTTPS, which had NO stall timeout — so an
      # unreachable/slow repo blocked the apply for the whole backstop below
      # (observed: a 5-min freeze tempting a Ctrl-C that then wedges the state
      # lock). Inject http.lowSpeed* config via env (git honours GIT_CONFIG_*),
      # so a fetch that stays under ~1 KB/s for 20s aborts and --keep-going moves
      # on, instead of hanging.
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: "http.lowSpeedLimit"
      GIT_CONFIG_VALUE_0: "1000"
      GIT_CONFIG_KEY_1: "http.lowSpeedTime"
      GIT_CONFIG_VALUE_1: "20"
    cmd: |
      _src=$(printf '%s/chezmoi' "$PWD" | tr '\\' '/')
      # With the http.lowSpeed* guards above a stalled external now aborts in
      # ~20s; chezmoi-apply-tolerant.sh's timeout is a last-resort backstop
      # against a total network stall.
      bash scripts/chezmoi-apply-tolerant.sh "{{.CHEZMOI}}" "$_src"

  chezmoi-diff:
    desc: Show pending chezmoi changes without applying them
    cmd: '{{.CHEZMOI}} diff'

  chezmoi-status:
    desc: Show chezmoi managed file status
    cmd: '{{.CHEZMOI}} status'

  chezmoi-add:
    desc: Add a file to the chezmoi source (FILE=<path>)
    cmd: '{{.CHEZMOI}} add "{{.FILE}}"'
    requires:
      vars: [FILE]

  chezmoi-edit:
    desc: Edit a chezmoi-managed file (FILE=<path>)
    cmd: '{{.CHEZMOI}} edit "{{.FILE}}"'
    requires:
      vars: [FILE]

  # System management - Auto-detect platform
  build:
    desc: Build the system configuration
    platforms: [linux, darwin]
    cmd: |
      {{if eq .IN_DEVCONTAINER "true"}}
        nix build .#homeConfigurations."{{.DEVCONTAINER_ATTR}}".activationPackage
      {{else if eq .IS_DARWIN "true"}}
        darwin-rebuild build --flake .#{{.HOST}}
      {{else if eq .IS_NIXOS "true"}}
        {{.NIX_CONFIG_PREFIX}}nixos-rebuild build --flake "{{.SYSTEM_FLAKE}}"
      {{else}}
        {{.NIX_CONFIG_PREFIX}}nix run "{{.HOME_MANAGER_APP}}" -- build --flake "{{.HOME_FLAKE}}"
      {{end}}

  switch:
    desc: Build and switch to the system configuration
    platforms: [linux, darwin]
    deps: [_snapshot-pre, _record-nix-config-dir, _chezmoi-ensure, fmt, generate:agent-instructions]
    # TEMP: bypass Homebrew cask operations during nix-darwin activation using
    # Homebrew's supported skip mechanism. Survives activation's
    # `sudo --preserve-env=PATH` via env_keep in hosts/darwin/default.nix.
    # TODO(nix-darwin-1789): restore the old Discord-only conditional skip after
    # nix-darwin PR #1789 lands and flake.lock includes it.
    env: &brew-cask-skip-env
      HOMEBREW_BUNDLE_CASK_SKIP:
        sh: |
          if command -v brew >/dev/null 2>&1; then
            echo 'android-platform-tools corretto@11 chromium dbeaver-community discord firefox flameshot google-chrome iterm2 jetbrains-toolbox jordanbaird-ice keepassxc kitty obsidian moonlight session-manager-plugin slack vivaldi whatsapp'
          fi
    cmd: |
      {{if eq .IN_DEVCONTAINER "true"}}
        nix run .#home-manager -- switch --flake .#"{{.DEVCONTAINER_ATTR}}" -b bak-devcontainer
      {{else if eq .IS_DARWIN "true"}}
        brew update --quiet
        # darwin-switch-tolerant.sh strips Home Manager's cosmetic orphan-link
        # spam from the live stream and downgrades Homebrew cask DOWNLOAD
        # failures (common on a work VPN) to a warning, while propagating every
        # other failure with darwin-rebuild's real exit code.
        bash scripts/darwin-switch-tolerant.sh .#{{.HOST}}
      {{else if eq .IS_NIXOS "true"}}
        bash scripts/nixos-switch-tolerant.sh "{{.SYSTEM_FLAKE}}"
      {{else}}
        {{.NIX_CONFIG_PREFIX}}nix run "{{.HOME_MANAGER_APP}}" -- switch --flake "{{.HOME_FLAKE}}" -b backup
      {{end}}

  # Darwin-specific tasks
  darwin:
    desc: Switch to the Darwin configuration
    platforms: [darwin]
    cmd: task switch HOST=darwin

  darwin-build:
    desc: Build the nix-darwin configuration
    platforms: [darwin]
    cmd: darwin-rebuild build --flake .#{{.HOST}}

  darwin-switch:
    desc: Build and switch to the nix-darwin configuration
    platforms: [darwin]
    deps: [_snapshot-pre, _record-nix-config-dir, _chezmoi-ensure]
    # See `switch`: skip an already-installed Discord cask in the darwin bundle.
    env: *brew-cask-skip-env
    # Tolerates VPN-blocked Homebrew cask downloads (see scripts/darwin-switch-tolerant.sh).
    cmd: bash scripts/darwin-switch-tolerant.sh .#{{.HOST}}

  # NixOS-specific tasks (kept for Linux systems)
  nixos-build:
    desc: Build the NixOS configuration
    platforms: [linux]
    cmd: '{{.NIX_CONFIG_PREFIX}}nixos-rebuild build --flake "{{.SYSTEM_FLAKE}}"'
    preconditions:
      - sh: '[[ -z "${INSIDE_DEVCONTAINER:-}" ]]'
        msg: 'This task is unavailable inside the devcontainer'

  nixos-switch:
    desc: Build and switch to the NixOS configuration
    platforms: [linux]
    deps: [_snapshot-pre, _record-nix-config-dir, _chezmoi-ensure]
    cmd: 'bash scripts/nixos-switch-tolerant.sh "{{.SYSTEM_FLAKE}}"'
    preconditions:
      - sh: '[[ -z "${INSIDE_DEVCONTAINER:-}" ]]'
        msg: 'This task is unavailable inside the devcontainer'

  boot:
    desc: Build and boot the NixOS configuration (for testing)
    platforms: [linux]
    cmd: '{{.NIX_CONFIG_PREFIX}}{{.ROOT_CMD}} nixos-rebuild boot --flake "{{.SYSTEM_FLAKE}}"'
    preconditions:
      - sh: '[[ -z "${INSIDE_DEVCONTAINER:-}" ]]'
        msg: 'This task is unavailable inside the devcontainer'

  test:
    desc: Test the NixOS configuration
    platforms: [linux]
    cmd: '{{.NIX_CONFIG_PREFIX}}nixos-rebuild test --flake "{{.SYSTEM_FLAKE}}"'
    preconditions:
      - sh: '[[ -z "${INSIDE_DEVCONTAINER:-}" ]]'
        msg: 'This task is unavailable inside the devcontainer'

  dry-build:
    desc: Perform a dry build to check for errors without applying changes
    platforms: [linux, darwin]
    cmd: |
      {{if eq .IN_DEVCONTAINER "true"}}
        nix build .#homeConfigurations."{{.DEVCONTAINER_ATTR}}".activationPackage --dry-run
      {{else if eq .IS_DARWIN "true"}}
        darwin-rebuild build --dry-run --flake .#{{.HOST}}
      {{else if eq .IS_NIXOS "true"}}
        {{.NIX_CONFIG_PREFIX}}nixos-rebuild dry-build --flake "{{.SYSTEM_FLAKE}}"
      {{else}}
        {{.NIX_CONFIG_PREFIX}}nix run "{{.HOME_MANAGER_APP}}" -- build --flake "{{.HOME_FLAKE}}"
      {{end}}

  # Home Manager
  home-build:
    desc: Build home-manager configuration
    platforms: [linux, darwin]
    cmd: |
      {{if eq .IN_DEVCONTAINER "true"}}
        nix build .#homeConfigurations."{{.DEVCONTAINER_ATTR}}".activationPackage
      {{else if eq .IS_DARWIN "true"}}
        darwin-rebuild build --flake .#{{.HOST}}
      {{else}}
        {{.NIX_CONFIG_PREFIX}}nix run "{{.HOME_MANAGER_APP}}" -- build --flake "{{.HOME_FLAKE}}"
      {{end}}

  home-switch:
    desc: Switch home-manager configuration
    platforms: [linux, darwin]
    deps: [_snapshot-pre, _record-nix-config-dir, _chezmoi-ensure]
    # See `switch`: skip an already-installed Discord cask in the darwin bundle.
    env: *brew-cask-skip-env
    cmd: |
      {{if eq .IN_DEVCONTAINER "true"}}
        nix run .#home-manager -- switch --flake .#"{{.DEVCONTAINER_ATTR}}" -b bak-devcontainer
      {{else if eq .IS_DARWIN "true"}}
        bash scripts/darwin-switch-tolerant.sh .#{{.HOST}}
      {{else if eq .IS_NIXOS "true"}}
        # On NixOS (incl. NixOS-WSL) home is managed as a NixOS module, not a
        # standalone homeConfiguration — there is no `{{.HOME_ATTR}}` attr to
        # build. Apply via the system rebuild; the login shell is set by
        # users.defaultUserShell, so the chsh fixup below is unnecessary.
        bash scripts/nixos-switch-tolerant.sh "{{.SYSTEM_FLAKE}}"
      {{else}}
        {{.NIX_CONFIG_PREFIX}}nix run "{{.HOME_MANAGER_APP}}" -- switch --flake "{{.HOME_FLAKE}}" -b backup
        _helper="$HOME/.local/bin/ensure-nix-zsh-shell"
        if [ -x "$_helper" ]; then
          "$_helper"
        else
          printf 'Note: ensure-nix-zsh-shell not deployed yet; login shell left unchanged.\n'
        fi
      {{end}}

  # Maintenance
  update:
    desc: Update flake inputs
    platforms: [linux, darwin]
    cmd: nix flake update

  gc:
    desc: Garbage collect old generations
    platforms: [linux, darwin]
    cmd: |
      nix-collect-garbage -d
      {{if ne .IN_DEVCONTAINER "true"}}
        {{.ROOT_CMD}} nix-collect-garbage -d
      {{end}}

  optimize:
    desc: Optimize nix store
    platforms: [linux, darwin]
    cmd: nix-store --optimise

  hooks:install:
    desc: Configure Git to use the repository's tracked hooks
    cmd: git config core.hooksPath .githooks

  # Development
  check:
    desc: Check flake for errors
    platforms: [linux, darwin]
    cmd: '{{.NIX_CONFIG_PREFIX}}nix flake check "path:$PWD"'

  fmt:
    desc: Format nix files (skips secrets/)
    platforms: [linux, darwin]
    # secrets/ is excluded from every formatter and linter in this file: those
    # files are SOPS output, so the extension never describes the contents —
    # sops emits JSON for some .toml/.yaml inputs. Formatting ciphertext
    # rewrites the file and invalidates its MAC. Keep the exclusion on every
    # fmt:*/lint:* task even where the directory holds no file of that type
    # today; a future encrypted secrets/*.sh or *.py must not break the chain.
    #
    # The file list comes from fd because alejandra's own --exclude only matches
    # exact file paths, not directories (verified on 4.0.0) — passing it
    # `--exclude secrets` silently formats the directory anyway.
    #
    # The empty-list guard is load-bearing: alejandra reads stdin when given no
    # file arguments, so a missing fd (CI runs a minimal `nix shell`) turned
    # into "unexpected end of file" on an anonymous stdin file rather than
    # anything pointing at fd. Fail loudly instead.
    cmd: |
      files=$(fd -e nix . --exclude secrets)
      [ -n "$files" ] || { printf 'fmt: no .nix files found — is fd installed?\n' >&2; exit 1; }
      alejandra $files

  fmt:check:
    desc: Check nix file formatting (skips secrets/)
    platforms: [linux, darwin]
    # See fmt: for why the list comes from fd and why the guard is required.
    cmd: |
      files=$(fd -e nix . --exclude secrets)
      [ -n "$files" ] || { printf 'fmt:check: no .nix files found — is fd installed?\n' >&2; exit 1; }
      alejandra --check $files

  fmt:md:
    desc: Auto-fix markdown files (skips ai-tools/, secrets/, chezmoi-generated agent instructions, and the CLAUDE.md pointer)
    platforms: [linux, darwin]
    cmd: markdownlint-cli2 --fix "**/*.md" "#node_modules" "#result" "#result-*" "#ai-tools" "#secrets" "#chezmoi/dot_config/github-copilot" "#chezmoi/dot_config/Code" "#CLAUDE.md"

  fmt:sh:
    desc: Format shell scripts in place (shfmt -w -i 0, skips ai-tools/ and secrets/)
    platforms: [linux, darwin]
    # -i 0 (tab indent, shfmt's default) is passed explicitly to match CI. shfmt
    # otherwise walks parent directories for an .editorconfig; this repo has
    # none, so a local run picks up ~/.editorconfig and reformats to 2 spaces
    # while CI — a container with no home config — keeps tabs. Passing any
    # formatting flag disables editorconfig lookup, making both identical.
    cmd: |
      shfmt -f . | awk '!/^ai-tools\// && !/^secrets\//' | while IFS= read -r f; do
        shfmt -w -i 0 "$f"
      done

  fmt:py:
    desc: Format Python files and apply ruff autofixes (skips ai-tools/ and secrets/)
    platforms: [linux, darwin]
    cmd: |
      ruff format --exclude ai-tools,secrets .
      ruff check --fix --exclude ai-tools,secrets .

  fmt:toml:
    desc: Format TOML files (taplo fmt, skips ai-tools/ and secrets/)
    platforms: [linux, darwin]
    # secrets/ is excluded deliberately: those .toml files are SOPS output, and
    # some are emitted as JSON regardless of extension. Reformatting encrypted
    # material rewrites the file and invalidates its MAC, so taplo must not see
    # it. See lint:toml for the matching exclusion.
    cmd: taplo fmt $(fd -e toml . --exclude ai-tools --exclude secrets)

  fmt:all:
    desc: Run every formatter (nix, markdown, shell, python, toml)
    platforms: [linux, darwin]
    cmds:
      - task: fmt
      - task: fmt:md
      - task: fmt:sh
      - task: fmt:py
      - task: fmt:toml

  lint:
    desc: Run all linters
    platforms: [linux, darwin]
    cmds:
      - task: lint:nix
      - task: lint:md
      - task: lint:sh
      - task: lint:py
      - task: lint:yaml
      - task: lint:toml
      - task: lint:secrets

  lint:nix:
    desc: Lint nix files (skips secrets/)
    platforms: [linux, darwin]
    cmd: |
      statix check . -i secrets
      deadnix --exclude secrets .
      task check:copilot-instructions
      task check:agent-instructions
      task check:instruction-size
      task check:model-agnostic
      task check:secret-hygiene

  check:secret-hygiene:
    desc: Enforce that private detail stays encrypted — this repo is public
    platforms: [linux, darwin]
    cmd: bash scripts/check-secret-hygiene.sh

  check:model-agnostic:
    desc: Enforce model-tier aliases in ai-tools — no versioned Claude model IDs
    platforms: [linux, darwin]
    cmd: |
      hits=$(rg -n 'claude-(opus|sonnet|haiku|fable|mythos)-[0-9]|claude-[0-9]|gpt-[0-9]' ai-tools/ || true)
      if [ -n "$hits" ]; then
        printf '%s\n' "$hits" >&2
        printf 'Versioned model IDs found in ai-tools/. Skills and agents must stay model-agnostic:\n' >&2
        printf 'speak in high/mid/low tiers (or Claude tier aliases in model: frontmatter) and resolve\n' >&2
        printf 'via agent-reference.md § Model Tiers. Pins live only in chezmoi/dot_claude/settings.json\n' >&2
        printf '(ANTHROPIC_DEFAULT_*_MODEL), common.nix (Copilot default), and that tier map.\n' >&2
        exit 1
      fi
      echo 'model-agnostic OK: no versioned model IDs in ai-tools/'

  lint:md:
    desc: Lint markdown files (skips ai-tools/, secrets/, chezmoi-generated agent instructions, and the CLAUDE.md pointer)
    platforms: [linux, darwin]
    cmd: markdownlint-cli2 "**/*.md" "#node_modules" "#result" "#result-*" "#ai-tools" "#secrets" "#chezmoi/dot_config/github-copilot" "#chezmoi/dot_config/Code" "#CLAUDE.md"

  lint:sh:
    desc: Lint and check formatting of shell scripts (skips ai-tools/ and secrets/)
    platforms: [linux, darwin]
    cmd: |
      shellcheck $(fd -e sh . --exclude node_modules --exclude ai-tools --exclude secrets)
      shfmt -f . | awk '!/^ai-tools\// && !/^secrets\//' | while IFS= read -r f; do
        shfmt -d -i 0 "$f"
      done

  lint:py:
    desc: Lint Python files (skips ai-tools/ and secrets/)
    platforms: [linux, darwin]
    cmd: ruff check --exclude ai-tools,secrets .

  lint:yaml:
    desc: Lint YAML files (skips secrets/ via .yamllint.yaml)
    platforms: [linux, darwin]
    cmd: yamllint .

  lint:toml:
    desc: Lint TOML files (skips ai-tools/ and secrets/)
    platforms: [linux, darwin]
    # secrets/*.toml are SOPS-encrypted and not valid TOML — sops writes some of
    # them as JSON whatever the extension — so taplo reports syntax errors on
    # ciphertext. Nothing lintable lives there. Mirrors the fmt:toml exclusion.
    cmd: taplo lint $(fd -e toml . --exclude ai-tools --exclude secrets)

  lint:secrets:
    desc: Scan repo history for committed secrets with gitleaks
    platforms: [linux, darwin]
    cmd: gitleaks git --redact --no-banner --verbose

  check:copilot-instructions:
    desc: Verify duplicated Copilot instruction files stay in sync
    cmd: bash ./scripts/check-copilot-instructions-sync.sh

  check:instruction-size:
    desc: Guard the per-turn agent instruction source against token bloat
    platforms: [linux, darwin]
    cmd: |
      src="chezmoi/dot_config/instructions/agent-defaults.md"
      max_lines=160
      max_bytes=10000
      lines=$(wc -l <"$src" | tr -d ' ')
      bytes=$(wc -c <"$src" | tr -d ' ')
      fail=0
      if [ "$lines" -gt "$max_lines" ]; then
        printf 'agent-defaults.md: %s lines exceeds budget %s\n' "$lines" "$max_lines" >&2
        fail=1
      fi
      if [ "$bytes" -gt "$max_bytes" ]; then
        printf 'agent-defaults.md: %s bytes exceeds budget %s\n' "$bytes" "$max_bytes" >&2
        fail=1
      fi
      if [ "$fail" -ne 0 ]; then
        printf '%s\n' "This file is rendered into every agent session's system prompt (the cached prefix); growth raises the per-turn token cost on every Claude AND Copilot session. Trim it, or raise the budget deliberately in taskfile.yaml." >&2
        exit 1
      fi
      printf 'instruction size OK: %s lines / %s bytes (budget %s / %s)\n' "$lines" "$bytes" "$max_lines" "$max_bytes"

  generate:agent-instructions:
    desc: Render agent-defaults.md into chezmoi-managed files for Windows deployment
    platforms: [linux, darwin]
    cmd: bash scripts/render-agent-instructions.sh .

  check:agent-instructions:
    desc: Verify chezmoi agent instruction files match the rendered source
    platforms: [linux, darwin]
    cmd: |
      tmp=$(mktemp -d)
      trap 'rm -rf "$tmp"' EXIT
      bash scripts/render-agent-instructions.sh "$tmp"

      fail=0
      diff -u "$tmp/chezmoi/dot_config/claude/CLAUDE.md" chezmoi/dot_config/claude/CLAUDE.md || fail=1
      diff -u "$tmp/chezmoi/dot_config/github-copilot/copilot-defaults.instructions.md" chezmoi/dot_config/github-copilot/copilot-defaults.instructions.md || fail=1
      diff -u "$tmp/chezmoi/dot_config/Code/User/prompts/copilot-defaults.instructions.md" "chezmoi/dot_config/Code/User/prompts/copilot-defaults.instructions.md" || fail=1
      diff -u "$tmp/chezmoi/dot_config/github-copilot/intellij/global-copilot-instructions.md" chezmoi/dot_config/github-copilot/intellij/global-copilot-instructions.md || fail=1

      if [ "$fail" -ne 0 ]; then
        printf '%s\n' 'Stale chezmoi agent instructions. Run: task generate:agent-instructions' >&2
        exit 1
      fi

  agents:update:
    desc: Update the off-nixpkgs agent CLIs (Claude Code, Copilot CLI) to latest via their native installers
    platforms: [linux, darwin]
    cmd: |
      _helper="$HOME/.local/bin/update-agent-clis"
      if [ ! -x "$_helper" ]; then
        printf 'update-agent-clis not deployed yet — run `task home-switch` first.\n' >&2
        exit 1
      fi
      "$_helper"

  dev:go-gui:
    desc: Enter the Go GUI development shell
    platforms: [linux]
    cmd: 'nix develop "path:$PWD#go-gui"'

  repl:
    desc: Start nix repl with flake
    platforms: [linux, darwin]
    cmd: nix repl --expr 'builtins.getFlake "."'

  # Platform-specific shortcuts
  linux:
    desc: Switch to the Linux configuration
    platforms: [linux]
    cmd: task switch HOST=linux

  wsl:
    desc: Switch to wsl configuration
    platforms: [linux]
    cmd: task switch HOST=wsl

  wsl-bootstrap-windows:
    desc: Bootstrap Windows tools and fonts from the WSL host
    platforms: [linux]
    cmd: ./scripts/wsl/bootstrap-windows.sh
    preconditions:
      - sh: '[[ -x /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe ]]'
        msg: 'Windows PowerShell is unavailable from this environment'

  windows-bootstrap:
    desc: Bootstrap Windows tools, fonts, and environment (run natively on Windows)
    platforms: [windows]
    cmd: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts/wsl/bootstrap-windows.ps1"

  # Service management
  service-status:
    desc: Check status of a specific user service
    platforms: [linux]
    cmd: systemctl --user status -- "{{.SERVICE}}"
    requires:
      vars: [SERVICE]
    preconditions:
      - sh: '[[ -z "${INSIDE_DEVCONTAINER:-}" ]]'
        msg: 'User systemd is unavailable inside the devcontainer'

  logs:
    desc: Show logs for a specific service
    platforms: [linux]
    cmd: journalctl --user --follow --unit "{{.SERVICE}}"
    requires:
      vars: [SERVICE]
    preconditions:
      - sh: '[[ -z "${INSIDE_DEVCONTAINER:-}" ]]'
        msg: 'journald is unavailable inside the devcontainer'

  # Quick actions
  edit:
    desc: Open the NixOS configuration in VS Code
    platforms: [linux, darwin]
    cmd: code ~/.config/nix

  upgrade:
    desc: Update nixpkgs and rebuild the system
    platforms: [linux, darwin]
    deps: [_snapshot-pre, _record-nix-config-dir, _chezmoi-ensure, fmt, generate:agent-instructions]
    env: *brew-cask-skip-env
    cmd: |
      nix flake update
      {{if eq .IN_DEVCONTAINER "true"}}
        nix run .#home-manager -- switch --flake .#"{{.DEVCONTAINER_ATTR}}" -b bak-devcontainer
      {{else if eq .IS_DARWIN "true"}}
        bash scripts/darwin-switch-tolerant.sh .#{{.HOST}}
      {{else if eq .IS_NIXOS "true"}}
        bash scripts/nixos-switch-tolerant.sh "{{.SYSTEM_FLAKE}}"
      {{else}}
        {{.NIX_CONFIG_PREFIX}}nix run "{{.HOME_MANAGER_APP}}" -- switch --flake "{{.HOME_FLAKE}}" -b backup
        _helper="$HOME/.local/bin/ensure-nix-zsh-shell"
        if [ -x "$_helper" ]; then
          "$_helper"
        else
          printf 'Note: ensure-nix-zsh-shell not deployed yet; login shell left unchanged.\n'
        fi
      {{end}}
      # Pull the off-nixpkgs agent CLIs (Claude Code, Copilot CLI) to latest too
      # — they are not in the flake, so `nix flake update` does not touch them.
      _agents="$HOME/.local/bin/update-agent-clis"
      if [ -x "$_agents" ]; then "$_agents"; else printf 'note: update-agent-clis not deployed; skipping agent CLI update\n'; fi
